name: lint

on:
   push:
      branches: [main]
   pull_request:

jobs:
   lint:
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v4

         - name: Install stylua
           run: |
              set -euo pipefail
              STYLUA_VERSION="2.0.2"
              curl -sSL \
                 "https://github.com/JohnnyMorganz/StyLua/releases/download/v${STYLUA_VERSION}/stylua-linux-x86_64.zip" \
                 -o /tmp/stylua.zip
              unzip -o /tmp/stylua.zip -d /tmp
              install -m 0755 /tmp/stylua /usr/local/bin/stylua
              stylua --version

         - name: stylua
           run: stylua --check .

         - name: Set up Lua
           uses: lunarmodules/setup-lua@v1
           with:
              lua-version: "5.1"

         - name: Install luacheck
           run: |
              sudo apt-get update -qq
              sudo apt-get install -yqq luarocks
              luarocks install luacheck

         - name: luacheck
           run: luacheck .

         - name: Install lua-language-server
           run: |
              set -euo pipefail
              LLS_VERSION="3.13.0"
              curl -sSL \
                 "https://github.com/LuaLS/lua-language-server/releases/download/${LLS_VERSION}/lua-language-server-${LLS_VERSION}-linux-x64.tar.gz" \
                 -o /tmp/lls.tgz
              mkdir -p /tmp/lls
              tar -xzf /tmp/lls.tgz -C /tmp/lls
              install -m 0755 /tmp/lls/bin/lua-language-server /usr/local/bin/lua-language-server
              lua-language-server --version

         - name: lua-language-server
           run: lua-language-server --check .
